# Weekly update PRs. Each one runs the full CI (build, links, Lighthouse), so a green PR is safe to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch bumps; major versions still get their own PR.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the Go port) drops the compiler API that `astro check` runs on, and
      # @astrojs/check only accepts ^5 || ^6. Remove this once its peer range includes 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
